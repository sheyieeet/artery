[General]
network = PrrFixtureNetwork
sim-time-limit = 0.5s
cmdenv-express-mode = true
cmdenv-interactive = false
**.cmdenv-log-level = off
**.vector-recording = false
*.cpmLinkPrr.**.scalar-recording = true
*.control.**.scalar-recording = true
**.scalar-recording = false
*.radioMedium.mediumLimitCache.carrierFrequency = 5.9GHz
*.node[*].mobility.initFromDisplayString = false
*.node[*].mobility.initialY = 0m
*.node[*].mobility.initialZ = 0m
*.node[*].mobility.constraintAreaMinX = -10m
*.node[*].mobility.constraintAreaMaxX = 1000m
*.node[*].mobility.constraintAreaMinY = -10m
*.node[*].mobility.constraintAreaMaxY = 1000m
*.node[*].mobility.constraintAreaMinZ = -10m
*.node[*].mobility.constraintAreaMaxZ = 1000m
*.node[*].rsu = index >= 2
*.node[*].wlan.radio.transmitter.power = 200mW
*.node[*].wlan.mac.hcf.edca.edcaf[*].cwMin = 0
*.node[*].wlan.mac.hcf.edca.edcaf[*].cwMax = 0

[Config lossfree]
*.testCase = "lossfree"
[Config loss]
*.testCase = "loss"
*.node[3].wlan.radio.receiver.sensitivity = 0dBm
[Config corrupt]
*.testCase = "corrupt"
[Config repeated]
*.testCase = "repeated"
[Config duplicate]
*.testCase = "duplicate"
[Config departure]
*.testCase = "departure"
[Config senderDeparture]
*.testCase = "senderDeparture"
[Config termination]
*.testCase = "termination"
[Config entry]
*.testCase = "entry"
*.node[3].equipped = false
[Config eligibility]
*.testCase = "eligibility"
*.node[2].equipped = false
*.node[3].wlan.radio.channelNumber = 184
[Config range]
*.testCase = "range"
*.stations = 7
*.node[0].mobility.initialX = 0m
*.node[1].mobility.initialX = 0m
*.node[2].mobility.initialX = 24.999m
*.node[3].mobility.initialX = 25m
*.node[4].mobility.initialX = 499.999m
*.node[5].mobility.initialX = 500m
*.node[5].mobility.initialZ = 100m
*.node[6].mobility.initialX = 500.001m
[Config warmup]
*.testCase = "repeated"
warmup-period = 0.15s
[Config rng]
*.testCase = "repeated"
*.node[*].wlan.mac.hcf.edca.edcaf[*].cwMin = 15
*.node[*].wlan.mac.hcf.edca.edcaf[*].cwMax = 1023
[Config stress]
*.testCase = "stress"
sim-time-limit = 1.2s
[Config noReceivers]
*.testCase = "noReceivers"
*.stations = 1
