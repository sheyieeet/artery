[General]
network = FreshnessNetwork
sim-time-limit = 1s
cmdenv-express-mode = true
cmdenv-interactive = false
**.cmdenv-log-level = off
**.vector-recording = true
*.observer.testCase = "${configname}"

[Config identity]
[Config multiReporter]
[Config duplicate]
[Config outOfOrder]
[Config local]
[Config range]
[Config lifecycle]
[Config missing]
[Config repack]
[Config encoders]
[Config warmup]
warmup-period = 0.25s
[Config idle]
sim-time-limit = 101s
[Config stress]
sim-time-limit = 12s
[Config roles]
[Config receiveHook]
[Config boundary]
[Config termination]

[Config snapshots]
