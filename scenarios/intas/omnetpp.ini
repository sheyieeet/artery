[General]
network = artery.envmod.World
user-interface = Cmdenv

# Recording & Output
output-vector-file = results/${configname}.vec
output-scalar-file = results/${configname}.sca
cmdenv-express-mode = true
cmdenv-autoflush = true
debug-on-errors = false
print-undisposed = true
**.cmdenv-log-level = off
*.withCpmLinkPrr = true
*.withCpmObjectFreshness = true
*.cpmObjectFreshness.**.scalar-recording = true
*.cpmLinkPrr.**.scalar-recording = true
**.scalar-recording = false
**.vector-recording = true
**.wlan[*].**.statistic-recording = false

# Simulation Timing & SUMO TraCI (Aligned with InTAS)
warmup-period = 300s
sim-time-limit = 360s 
*.traci.core.startTime = 300s
*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.seed = 23423
*.traci.launcher.sumocfg = "InTAS_buildings.sumocfg"
*.traci.launcher.sumo = "sumo" 
*.traci.nodes.typename = "InsertionDelayNodeManager"
*.traci.mapper.typename = "traci.MultiTypeModuleMapper"
*.traci.mapper.vehicleTypes = xmldoc("vehicles.xml")
*.traci.nodes.destroyVehiclesOnCrash = true

# RSU Nodes Definition
*.staticNodes.nodes = xmldoc("rsus.xml")

# Physical Environment & GEMV2 
*.withPhysicalEnvironment = true
*.physicalEnvironment.groundType = "FlatGround"
*.radioMedium.pathLossType = "Gemv2"
*.radioMedium.pathLoss.withSmallScaleVariations = false
*.radioMedium.obstacleLossType = "DielectricObstacleLoss"

# Global Radio & MAC Constraints (MTU & Queue Fixes)
*.node[*].numRadios = 1
*.node[*].wlan[*].radio.transmitter.power = 200 mW
*.node[*].wlan[*].radio.receiver.snirThreshold = 4 dB
*.node[*].wlan[*].mac.dcf.channelAccess.pendingQueue.packetCapacity = 1000
*.node[*].wlan[*].mac.mtu = 1500B 

# Vehicle Sensors (Standardized to 60deg / 150m)
*.node[*].environmentModel.sensors = xmldoc("vehiclesensors.xml")
*.node[*].environmentModel.FrontRadar.fovRange = 150m
*.node[*].environmentModel.FrontRadar.fovAngle = 60.0

# Base Middleware (Vehicles)
**.identityRegistryModule = "idRegistry"
*.node[*].middleware.datetime = "2018-03-19 10:00:00"

# RSU Parameters & Sensors
*.rsu*.wlan[*].radio.transmitter.power = 47.9 mW
*.rsu*.middleware.datetime = "2018-03-19 10:00:00"
*.rsu*.middleware.services = xmldoc("rsuservices.xml")
*.rsu*.environmentModel.sensors = xmldoc("rsusensors.xml")
*.rsu*.environmentModel.*.drawSensorCone = true
*.rsu*.environmentModel.*.drawLinesOfSight = true
*.rsu*.environmentModel.*.drawDetectedObjects = true
*.rsu*.environmentModel.*.drawBlockingObstacles = true
*.rsu*.environmentModel.Radar.fovRange = 200m
*.rsu*.environmentModel.Radar.fovAngle = 20.0
*.rsu*.environmentModel.SeeThrough.fovRange = 50m

# =================================================================
# BASELINE CONFIGURATIONS 
# =================================================================

[Config Proposed]
*.node[*].middleware.services = xmldoc("services.xml")
*.node[*].middleware.CP.useProposedGenerationRules = true

[Config Static]
*.node[*].middleware.services = xmldoc("services_static.xml")

[Config ETSI]
*.node[*].middleware.services = xmldoc("services_etsi.xml")

[Config LookAhead]
*.node[*].middleware.services = xmldoc("services_lookAhead.xml")

[Config VPCast]
*.node[*].middleware.services = xmldoc("services_VPCast.xml")
# VP-CAST Vmax: network ceiling, including passenger-accessible motorway lanes.
*.node[*].middleware.CP.maxVehicleSpeed = 83.33mps

[Config wPPersistence]
*.node[*].middleware.services = xmldoc("services_wPPersistence.xml")
